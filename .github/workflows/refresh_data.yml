name: Fenix — Actualización diaria (cierre + respaldo)

on:
  schedule:
    # GitHub usa UTC y EEUU cambia de horario: dos horarios de cierre y la
    # compuerta (scripts/run_gate.py) deja correr solo el que corresponde.
    # AndFig corría a las 21:30 UTC y GitHub lo retrasaba hasta pasadas las
    # 00:00 UTC, justo cuando Yahoo entrega la última vela vacía.
    - cron: '20 20 * * 1-5'   # 16:20 ET con horario de verano (EDT)
    - cron: '20 21 * * 1-5'   # 16:20 ET con horario de invierno (EST)
    # Respaldo 06:17 / 07:17 ET del día siguiente: solo corre si la noche falló.
    - cron: '17 11 * * 2-6'
  workflow_dispatch:
    inputs:
      forzar:
        description: "Publicar aunque la guarda de salud falle (escribe 'si' solo si sabes lo que haces)"
        required: false
        default: 'no'

permissions:
  contents: write

concurrency:
  group: fenix-data
  cancel-in-progress: false

# Tres pasos: tus grupos y el listado completo se calculan EN PARALELO (dos
# máquinas a la vez, así todo termina antes de la medianoche UTC) y luego un
# tercer paso junta los datos, evalúa las alertas y publica.
jobs:
  compuerta:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Traer lo último (por si otra corrida ya publicó esta sesión)
        run: git pull --ff-only origin "${GITHUB_REF_NAME}" || true
      - name: ¿Toca correr?
        id: gate
        run: python scripts/run_gate.py
        env:
          TZ: America/New_York
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}

  grupos:
    needs: compuerta
    if: needs.compuerta.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: git pull --ff-only origin "${GITHUB_REF_NAME}" || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Tus grupos (velas limpias + reparación + guarda de salud + backtest)
        run: python scripts/build_data.py --out-dir data ${{ github.event.inputs.forzar == 'si' && '--force-publish' || '' }}
        env:
          TZ: America/New_York
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: datos-grupos
          path: |
            data/snapshot.json
            data/health.json
            data/backtest.json
          if-no-files-found: ignore
          retention-days: 3

  listado:
    needs: compuerta
    if: needs.compuerta.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - run: git pull --ff-only origin "${GITHUB_REF_NAME}" || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Recuperar la caché de fundamentales
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: fenix-fund-${{ github.run_id }}
          restore-keys: fenix-fund-
      - name: Listado completo (~9.600 activos, misma lógica que tus grupos)
        run: python scripts/listado_scan.py ${{ github.event.inputs.forzar == 'si' && '--force-publish' || '' }}
        env:
          TZ: America/New_York
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          LISTADO_BUDGET_MIN: '170'
      - name: Guardar la caché de fundamentales
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: fenix-fund-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datos-listado
          path: |
            data/listado.json
            data/listado_health.json
          if-no-files-found: ignore
          retention-days: 3

  publicar:
    needs: [compuerta, grupos, listado]
    if: always() && needs.compuerta.outputs.run == 'true' && needs.grupos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: git pull --ff-only origin "${GITHUB_REF_NAME}" || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements.txt
      - name: Traer los datos de tus grupos
        uses: actions/download-artifact@v4
        with:
          name: datos-grupos
          path: data
      - name: Traer el listado completo (si falló, se usa el anterior y sus alertas no cuentan hoy)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: datos-listado
          path: data

      - name: Alertas (solo con datos sanos; incluye el listado completo)
        run: python scripts/check_alerts.py
        env:
          TZ: America/New_York
          FENIX_IGNORE_HEALTH: ${{ github.event.inputs.forzar == 'si' && '1' || '0' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Seguimiento de alertas (historial con resultados)
        run: python scripts/track_alerts.py
        env:
          TZ: America/New_York

      - name: Datos del Seguimiento (parámetros del día de la señal + distancias EMA)
        run: |
          python scripts/seguimiento.py
          node scripts/seguimiento_export.js
        env:
          TZ: America/New_York

      - name: Guarda de tamaño (límite GitHub 100MB)
        run: |
          FAIL=0
          for f in data/*.json data/*.csv; do
            [ -f "$f" ] || continue
            SZ=$(stat -c%s "$f")
            MB=$((SZ / 1048576))
            echo "$f → ${MB}MB"
            if [ "$SZ" -gt 94371840 ]; then
              echo "::error::$f pesa ${MB}MB — supera el margen seguro (90MB) del límite de GitHub (100MB). No se commitea."
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "chore: Fenix actualización $(date -u +%F) [automated]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 15
          done
          exit 1
